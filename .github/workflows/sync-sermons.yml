name: Update sermons
on:
  schedule:
    - cron: '23 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-sermons
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run sync:sermons
      - run: npm run check
      - name: Commit changed sermon data
        shell: bash
        run: |
          if ! git diff --quiet -- sermon-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sermon-data.js
            git commit -m "Update church sermon list"
            git push origin HEAD:main
          fi
